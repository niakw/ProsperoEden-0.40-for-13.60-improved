name: Build and release Prospero.Eden Encore

on:
  push:
    branches:
      - fix/0.40-zbic-13.60
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the green build as a GitHub Release
        required: false
        type: boolean
        default: false
      resume_run_id:
        description: Optional failed run ID whose staged app artifact should be reused
        required: false
        type: string
        default: ""
      build_only:
        description: Skip already-green validation gates and go straight to native prepare/build
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: prospero-eden-encore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[publish-existing]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PROSPEROEDEN_GIT_DEPS_ROOT: .deps/repos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build toolchain
        if: ${{ inputs.resume_run_id == '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 libclang-18-dev lld-18 llvm-18 llvm-18-dev llvm-18-tools llvm-spirv-18 libllvmspirvlib-18-dev \
            cmake ninja-build ccache make nasm meson rsync git \
            glslang-tools spirv-tools bison flex autoconf binutils coreutils util-linux \
            curl wget unzip librsvg2-bin imagemagick \
            python3 python3-venv python3-pip python3-mako python3-yaml pkg-config

      - name: Upgrade Meson
        if: ${{ inputs.resume_run_id == '' }}
        run: |
          python3 -m pip install --user --break-system-packages "meson==1.12.1"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Check toolchain
        if: ${{ inputs.resume_run_id == '' && !inputs.build_only }}
        run: make toolchain

      - name: Validate launcher translations and locale runtime
        if: ${{ inputs.resume_run_id == '' && !inputs.build_only }}
        run: |
          python3 -B tools/launcher/strings.py check
          python3 -B tools/check-language-runtime.py

      - name: Restore build caches
        if: ${{ inputs.resume_run_id == '' }}
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/prosperoeden-deps
            ~/.cache/ps5-eden-headless.*
            ~/.cache/prosperoeden-mkpfs
            .deps
          key: prospero-eden-encore-040-${{ runner.os }}-${{ hashFiles('tools/deps.json') }}
          restore-keys: |
            prospero-eden-encore-040-${{ runner.os }}-
            prosperoeden-040-zbic-${{ runner.os }}-

      - name: Prepare cacheable sibling dependency paths
        if: ${{ inputs.resume_run_id == '' }}
        run: bash tools/ci/link-sibling-deps.sh

      - name: Validate release metadata and legal bundle
        if: ${{ inputs.resume_run_id == '' && !inputs.build_only }}
        run: |
          python3 -B tools/ci/check-release-metadata.py
          python3 -B tools/ci/check-licenses.py

      - name: Validate startup, elevation and storage contracts
        if: ${{ inputs.resume_run_id == '' && !inputs.build_only }}
        run: |
          python3 -B tools/check-startup-contract.py
          python3 -B tools/check-filesystem-probe.py
          python3 -B tools/check-storage-contract.py
          python3 -B tools/check-legacy-migration.py
          python3 -B tools/check-video-presets.py
          python3 -B tools/check-encore-ux.py
          python3 -B tools/check-jit-stability.py
          python3 -B tools/check-performance-policy.py
          python3 -B tools/check-network-runtime.py
          python3 -B tools/check-net-cache-migration.py
          python3 -B tools/check-ps5-net-unit.py
          python3 -B tools/check-home-media.py
          python3 -B tools/check-bounded-logs.py
          python3 -B tools/check-log-budget.py
          python3 -B tools/check-log-pipe-unit.py
          python3 -B tools/check-release-hotpath.py
          python3 -B tools/check-sm-host-wait.py
          python3 -B tools/check-dummy-thread-waits.py
          python3 -B tools/check-dynarmic-icache.py
          python3 -B tools/check-ps5-backport-policy.py
          python3 -B tools/check-fc27-trace.py
          python3 -B tools/check-credit-attribution.py
          python3 -B tools/check-ci-cache.py

      - name: Preflight release packaging
        if: ${{ inputs.resume_run_id == '' && !inputs.build_only }}
        run: bash tools/ci/package-image.sh --prepare

      - name: Restore staged app from a previous failed run
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Prospero.Eden-Encore-staged-app
          path: build/release/PPSA99008
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Prepare native build inputs
        if: ${{ inputs.resume_run_id == '' }}
        run: make prepare JOBS=4

      - name: Build and stage shipping app
        id: stage
        if: ${{ inputs.resume_run_id == '' }}
        env:
          EDEN_SKIP_PREBUILD_SOURCE_CHECKS: ${{ inputs.build_only && '1' || '0' }}
        run: bash tools/build-package.sh release-stage

      - name: Save build caches immediately after staging
        if: ${{ !cancelled() && steps.stage.outcome != 'skipped' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/prosperoeden-deps
            ~/.cache/ps5-eden-headless.*
            ~/.cache/prosperoeden-mkpfs
            .deps
          key: prospero-eden-encore-040-${{ runner.os }}-${{ hashFiles('tools/deps.json') }}-${{ github.run_id }}

      - name: Upload resumable staged app
        if: ${{ steps.stage.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Prospero.Eden-Encore-staged-app
          path: build/release/PPSA99008/
          retention-days: 7
          if-no-files-found: error

      - name: Validate freshly built staged app
        if: ${{ inputs.resume_run_id == '' }}
        env:
          EDEN_PACKAGE_DIR: build/release/PPSA99008
        run: |
          python3 -B headless/check_package.py --check
          python3 -B tools/ci/check-staged-app.py build/release/PPSA99008

      - name: Validate resumed staged app
        if: ${{ inputs.resume_run_id != '' }}
        run: python3 -B tools/ci/check-staged-app.py build/release/PPSA99008

      - name: Assemble release files
        run: python3 -B tools/ci/make-dist.py build/release/PPSA99008

      - name: Upload compiled release bundle
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Prospero.Eden-Encore-release
          path: |
            dist/
            build/symbols/
          retention-days: 14
          if-no-files-found: error


  release:
    needs: build
    if: >-
      ${{ needs.build.result == 'success' &&
          ((github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) ||
           (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download compiled bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Prospero.Eden-Encore-release
          path: release-bundle

      - name: Verify release assets
        run: |
          set -euo pipefail
          test -f release-bundle/dist/SHA256SUMS
          ls release-bundle/dist/*.zip >/dev/null
          ls release-bundle/dist/*.ffpfsc >/dev/null
          (cd release-bundle/dist && sha256sum -c SHA256SUMS)

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          tag="encore-R1-${short}"
          notes="release-bundle/dist/release-notes.md"
          test -f "$notes"
          gh release create "$tag" \
            release-bundle/dist/*.zip \
            release-bundle/dist/*.ffpfsc \
            release-bundle/dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Prospero.Eden Encore R1 (${short})" \
            --notes-file "$notes" \
            --latest
