name: Build and release Prospero.Eden Encore

on:
  push:
    branches:
      - fix/0.40-zbic-13.60
      - dev/ps5-sparse-jit
      # On dev, build job is gated by the explicit [full-build] marker below.
      # Ordinary dev commits do not compile or publish a native app.
  # workflow_dispatch remains available for deliberate build / stage-resume.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the green build as a GitHub Release
        required: false
        type: boolean
        default: false
      resume_run_id:
        description: Optional failed run ID whose staged app artifact should be reused
        required: false
        type: string
        default: ""
      build_only:
        description: Skip already-green validation gates and go straight to native prepare/build
        required: false
        type: boolean
        default: false
      test_all_on:
        description: Unified PS5 test app (sparse JIT, CPU placement, frame diagnostics ON; never publish)
        required: false
        type: boolean
        default: false
      test_title_id:
        description: Nintendo Switch game title ID for test autoboot (default FC27)
        required: false
        type: string
        default: "0100C49025D3E000"

permissions:
  contents: read
  actions: read

concurrency:
  group: prospero-eden-encore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      ${{ !contains(github.event.head_commit.message || '', '[publish-existing]') &&
          (github.ref == 'refs/heads/fix/0.40-zbic-13.60' ||
           github.event_name == 'workflow_dispatch' ||
           contains(github.event.head_commit.message || '', '[full-build]') ||
           contains(github.event.head_commit.message || '', '[resume-stage:37728435816]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PROSPEROEDEN_GIT_DEPS_ROOT: .deps/repos
      EDEN_TEST_ALL_ON: ${{ (inputs.test_all_on || (github.ref == 'refs/heads/dev/ps5-sparse-jit' && contains(github.event.head_commit.message || '', '[test-all-on]'))) && '1' || '0' }}
      EDEN_TEST_TITLE_ID: ${{ inputs.test_title_id || '0100C49025D3E000' }}
      EDEN_STAGE_DIR: ${{ (inputs.test_all_on || (github.ref == 'refs/heads/dev/ps5-sparse-jit' && contains(github.event.head_commit.message || '', '[test-all-on]'))) && 'build/dev/PPSA99008' || 'build/release/PPSA99008' }}
      # GitHub-only push resume for an already compiled staged app. This marker
      # is one-shot and cannot alter the downloaded binary or publish a release.
      RESUME_STAGE_RUN_ID: ${{ contains(github.event.head_commit.message || '', '[resume-stage:37728435816]') && '37728435816' || inputs.resume_run_id || '' }}
    steps:
      - name: Refuse test profile on release branch or unsafe bypass
        if: ${{ (inputs.test_all_on || (github.ref == 'refs/heads/dev/ps5-sparse-jit' && contains(github.event.head_commit.message || '', '[test-all-on]'))) }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev/ps5-sparse-jit
          test "$EDEN_TEST_ALL_ON" = 1
          [[ "$EDEN_TEST_TITLE_ID" =~ ^[0-9A-Fa-f]{16}$ ]]
          test "${{ inputs.build_only }}" != true
          test -z "${{ inputs.resume_run_id }}"
          test "${{ inputs.publish }}" != true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build toolchain
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 libclang-18-dev lld-18 llvm-18 llvm-18-dev llvm-18-tools llvm-spirv-18 libllvmspirvlib-18-dev \
            cmake ninja-build ccache make nasm meson rsync git \
            glslang-tools spirv-tools bison flex autoconf binutils coreutils util-linux \
            curl wget unzip librsvg2-bin imagemagick \
            python3 python3-venv python3-pip python3-mako python3-yaml pkg-config \
            libboost-container-dev
          # The host core gate already installed Boost.Container; the native
          # workflow did not. Verify the real C++ include before lengthy
          # Vulkan readback/prefetch checks or PS5 SDK compilation.
          printf '#include <boost/container/small_vector.hpp>\n' |
            clang++-18 -std=c++20 -x c++ -fsyntax-only -

      - name: Upgrade Meson
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        run: |
          python3 -m pip install --user --break-system-packages "meson==1.12.1"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Check toolchain
        if: ${{ env.RESUME_STAGE_RUN_ID == '' && !inputs.build_only }}
        run: make toolchain

      - name: Validate launcher translations and locale runtime
        if: ${{ env.RESUME_STAGE_RUN_ID == '' && !inputs.build_only }}
        run: |
          python3 -B tools/launcher/strings.py check
          python3 -B tools/check-language-runtime.py

      - name: Restore build caches
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/prosperoeden-deps
            ~/.cache/ps5-eden-headless.*
            ~/.cache/prosperoeden-mkpfs
            .deps
          key: prospero-eden-encore-040-${{ runner.os }}-${{ hashFiles('tools/deps.json') }}
          restore-keys: |
            prospero-eden-encore-040-${{ runner.os }}-
            prosperoeden-040-zbic-${{ runner.os }}-

      - name: Prepare cacheable sibling dependency paths
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        run: bash tools/ci/link-sibling-deps.sh

      - name: Validate release metadata and legal bundle
        if: ${{ env.RESUME_STAGE_RUN_ID == '' && !inputs.build_only }}
        run: |
          python3 -B tools/ci/check-release-metadata.py
          python3 -B tools/ci/check-licenses.py

      - name: Validate startup, elevation and storage contracts
        if: ${{ env.RESUME_STAGE_RUN_ID == '' && !inputs.build_only }}
        run: |
          # Collect ALL independent source/harness failures in this one run,
          # but fail the gate if any check fails. Never bypass verification.
          set +e
          validation_failed=0
          trap 'rc=$?; echo "::error::Validation failed (exit $rc): $BASH_COMMAND"; validation_failed=1' ERR
          python3 -B tools/check-startup-contract.py
          python3 -B tools/check-filesystem-probe.py
          python3 -B tools/check-storage-contract.py
          python3 -B tools/check-legacy-migration.py
          python3 -B tools/check-video-presets.py
          python3 -B tools/check-encore-ux.py
          python3 -B tools/check-native-ui-focus.py
          python3 -B tools/check-jit-stability.py
          python3 -B tools/check-experimental-performance.py
          python3 -B tools/check-ps5-all-on-contract.py
          python3 -B tools/check-ps5-architecture.py
          python3 -B tools/check-python-source-syntax.py
          # Native allocation ownership and 3 GiB VA/128 MiB PA rollback
          # require their real 8-thread UBSan/TSan host harness, not just
          # source-string contracts. Installed clang-18 above.
          python3 -B tools/check-heap-growth.py
          python3 -B tools/check-heap-growth-rollback-host.py
          python3 -B tools/check-heap-growth-diagnostics-host.py
          python3 -B tools/check-crash-provenance-host.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nlohmann-json3-dev
          python3 -B tools/sync-glyph-overrides.py --manifest data/glyph-overrides.json --check
          python3 -B tools/check-glyph-overrides-runtime.py
          python3 -B tools/check-addon-snapshot-host.py
          python3 -B tools/check-ps-glyph-packs.py
          python3 -B tools/check-controller-semantic-mapping.py
          python3 -B tools/check-ps5-autocontrol-context.py
          python3 -B tools/check-ps5-live-input.py
          python3 -B tools/check-ps5-interactive-boot.py
          python3 -B tools/check-ps5-ui-stream-buffer.py
          python3 -B tools/check-ps5-ui-controls-per-game.py
          python3 -B tools/check-vulkan-shader-workers.py
          python3 -B tools/check-vulkan-shader-workers-cpp-host.py
          python3 -B tools/check-worker-topology.py
          python3 -B tools/check-worker-affinity.py
          python3 -B tools/check-ps5-dev-cache-contention.py
          python3 -B tools/check-gpu-native-diagnostics.py
          python3 -B tools/check-gpu-physical-copy-bounds-host.py
          python3 -B tools/check-gpu-physical-copy-cpp-host.py
          python3 -B tools/check-gpu-atomic-forward-cpp-host.py
          python3 -B tools/check-gpu-asid-lifetime-cpp-host.py
          python3 -B tools/check-gpu-memory-mapping-source.py
          python3 -B tools/check-gpu-backport-replay-host.py
          python3 -B tools/check-eden-atomic-cache-refresh-host.py
          python3 -B tools/check-ps5-guest-null-backing-host.py
          python3 -B tools/check-guest-backport-replay-host.py
          python3 -B tools/check-sparse-index-boundary.py
          python3 -B tools/check-sparse-slot-reuse-host.py
          python3 -B tools/check-jit-memory-policy.py
          python3 -B tools/check-jit-startup-retry.py
          python3 -B tools/check-vulkan-pipeline-persistence.py
          python3 -B tools/check-vulkan-cache-atomic.py
          python3 -B tools/check-jit-dense-alias-host.py
          python3 -B tools/check-jit-sparse-host.py
          python3 -B tools/check-ps5-sparse-jit-va-lifetime.py
          python3 -B tools/check-ps5-direct-limit-host.py
          python3 -B tools/check-ps5-virtual-reservation-host.py
          python3 -B tools/check-shader-cache-pressure.py
          python3 -B tools/check-vulkan-gc-budget-host.py
          python3 -B tools/check-vulkan-gc-prefetch-host.py
          python3 -B tools/check-vulkan-gc-mixed-prefetch-host.py
          python3 -B tools/check-vulkan-readback-small-vector-host.py
          python3 -B tools/check-vulkan-readback-batch-integration-host.py
          python3 -B tools/check-vulkan-pipeline-trace-thread-host.py
          python3 -B tools/check-vulkan-present-wait-host.py
          python3 -B tools/check-vulkan-present-source-replay-host.py
          python3 -B tools/check-performance-policy.py
          python3 -B tools/check-ps5-quiet-cpu-io-clocks.py
          python3 -B tools/check-ps5-quiet-guest-entry.py
          python3 -B tools/check-ps5-direct-pool-host.py
          python3 -B tools/check-ps5-pc-ring-host.py
          python3 -B tools/check-ps5-worker-lifetime-host.py
          python3 -B tools/check-hle-counter-contention.py
          python3 -B tools/check-network-runtime.py
          python3 -B tools/check-guest-network-isolation.py
          python3 -B tools/check-nlib-media-safety.py
          python3 -B tools/check-nlib-ui-recovery.py
          python3 -B tools/check-ps5-log-analysis.py
          python3 -B tools/check-ps5-frame-window-analysis.py
          python3 -B tools/check-universal-emulation-policy.py
          python3 -B tools/check-runtime-frame-budget.py
          python3 -B tools/check-library-docked-snapshot-host.py
          python3 -B tools/check-fc27-hle-compat.py
          python3 -B tools/check-net-cache-migration.py
          python3 -B tools/check-ps5-net-unit.py
          python3 -B tools/check-home-reference.py
          python3 -B tools/check-home-media.py
          python3 -B tools/check-bounded-logs.py
          python3 -B tools/check-log-budget.py
          python3 -B tools/check-log-pipe-unit.py
          python3 -B tools/check-release-hotpath.py
          python3 -B tools/check-sm-host-wait.py
          python3 -B tools/check-dummy-thread-waits.py
          python3 -B tools/check-dynarmic-icache.py
          python3 -B tools/check-ps5-backport-policy.py
          python3 -B tools/check-game-liveness.py
          python3 -B tools/check-ps5-guest-fault-recovery.py
          python3 -B tools/check-fc27-trace.py
          python3 -B tools/check-credit-attribution.py
          python3 -B tools/check-ci-cache.py
          if (( validation_failed )); then
            echo "::error::One or more source/host contracts failed; native build blocked"
            exit 1
          fi

      - name: Preflight release packaging
        if: ${{ env.RESUME_STAGE_RUN_ID == '' && !inputs.build_only }}
        run: bash tools/ci/package-image.sh --prepare

      - name: Restore staged app from a previous failed run
        if: ${{ env.RESUME_STAGE_RUN_ID != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Prospero.Eden-Encore-staged-app
          path: build/release/PPSA99008
          github-token: ${{ github.token }}
          run-id: ${{ env.RESUME_STAGE_RUN_ID }}

      - name: Prepare native build inputs
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        run: make prepare JOBS=4

      - name: Build and stage PS5 app (release OR all-on test)
        id: stage
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        env:
          EDEN_SKIP_PREBUILD_SOURCE_CHECKS: ${{ inputs.build_only && '1' || '0' }}
        run: |
          set -euo pipefail
          if [[ "$EDEN_TEST_ALL_ON" == 1 ]]; then
            bash tools/build-package.sh dev "$EDEN_TEST_TITLE_ID"
          else
            bash tools/build-package.sh release-stage
          fi

      - name: Save build caches immediately after staging
        if: ${{ !cancelled() && steps.stage.outcome != 'skipped' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/prosperoeden-deps
            ~/.cache/ps5-eden-headless.*
            ~/.cache/prosperoeden-mkpfs
            .deps
          key: prospero-eden-encore-040-${{ runner.os }}-${{ hashFiles('tools/deps.json') }}-${{ github.run_id }}

      - name: Upload resumable staged app
        if: ${{ steps.stage.outcome == 'success' && env.EDEN_TEST_ALL_ON != '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Prospero.Eden-Encore-staged-app
          path: ${{ env.EDEN_STAGE_DIR }}/
          retention-days: 7
          if-no-files-found: error

      - name: Validate freshly built staged app
        if: ${{ env.RESUME_STAGE_RUN_ID == '' }}
        env:
          EDEN_PACKAGE_DIR: ${{ env.EDEN_STAGE_DIR }}
        run: |
          python3 -B headless/check_package.py --check
          python3 -B tools/ci/check-staged-app.py "$EDEN_STAGE_DIR"
          if [[ "$EDEN_TEST_ALL_ON" == 1 ]]; then
            python3 -B tools/ci/check-all-on-test-binary.py "$EDEN_STAGE_DIR" "$EDEN_TEST_TITLE_ID"
          fi

      - name: Record matching unstripped ELF and staged PS5 binary SHA256
        if: ${{ success() && env.EDEN_TEST_ALL_ON == '1' }}
        run: |
          python3 -B tools/ci/write-crash-provenance.py \
            --app build/dev/PPSA99008 \
            --native build/headless-native \
            --output build/headless-native/crash-provenance.json \
            --test-title "$EDEN_TEST_TITLE_ID"

      - name: Upload checked all-on PS5 test app
        if: ${{ success() && env.EDEN_TEST_ALL_ON == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Prospero.Eden-Encore-PS5-all-on-test
          path: build/dev/PPSA99008/
          retention-days: 14
          if-no-files-found: error

      - name: Upload unstripped PS5 All-On crash symbols
        if: ${{ success() && env.EDEN_TEST_ALL_ON == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Prospero.Eden-Encore-PS5-all-on-symbols
          path: |
            build/headless-native/llvm-pie.elf
            build/headless-native/link.map
            build/headless-native/crash-provenance.json
          retention-days: 14
          if-no-files-found: error

      - name: Validate resumed staged app
        if: ${{ env.RESUME_STAGE_RUN_ID != '' }}
        run: python3 -B tools/ci/check-staged-app.py build/release/PPSA99008

      - name: Assemble release files
        if: ${{ env.EDEN_TEST_ALL_ON != '1' }}
        run: python3 -B tools/ci/make-dist.py build/release/PPSA99008

      - name: Upload compiled release bundle
        if: ${{ success() && env.EDEN_TEST_ALL_ON != '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Prospero.Eden-Encore-release
          path: |
            dist/
            build/symbols/
          retention-days: 14
          if-no-files-found: error


  release:
    needs: build
    if: >-
      ${{ needs.build.result == 'success' && !inputs.test_all_on &&
          github.ref == 'refs/heads/fix/0.40-zbic-13.60' &&
          ((github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) ||
           (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download compiled bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Prospero.Eden-Encore-release
          path: release-bundle

      - name: Verify release assets
        run: |
          set -euo pipefail
          test -f release-bundle/dist/SHA256SUMS
          ls release-bundle/dist/*.zip >/dev/null
          ls release-bundle/dist/*.ffpfsc >/dev/null
          (cd release-bundle/dist && sha256sum -c SHA256SUMS)

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          tag="encore-R1-${short}"
          notes="release-bundle/dist/release-notes.md"
          test -f "$notes"
          gh release create "$tag" \
            release-bundle/dist/*.zip \
            release-bundle/dist/*.ffpfsc \
            release-bundle/dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Prospero.Eden Encore R1 (${short})" \
            --notes-file "$notes" \
            --latest
